name: focusmatrix
region: nyc
services:
  - name: web
    image:
      registry_type: DOCR
      repository: focusmatrix
      tag: __IMAGE_TAG__
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    routes:
      - path: /
